[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nninterpolator"
version = "0.1.0"
description = "A neural network library for continuous function approximation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "pandas",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]